# SICA - Configuracion de Conexion JDBC
# Cambiar estos valores segun tu entorno de base de datos

db.url=jdbc:mysql://localhost:3306/sica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=learningmysql

# Pool de conexiones DBCP2
db.pool.initialSize=5
db.pool.maxTotal=20
db.pool.maxIdle=10
db.pool.minIdle=5
db.pool.maxWaitMillis=10000
